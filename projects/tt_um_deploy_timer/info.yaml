# Tiny Tapeout project information
project:
  title:        "launch deployment timer"      # Project title
  author:       "Eric Pearson"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Accelerometer triggered timer with deployment sequencing"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     48000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_deploy_timer"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "ldt_core.sv"
    - "accel.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "sw1" # active low + 1 sec
  ui[1]: "sw2" # active low + 2 sec
  ui[2]: "sw4" # active low + 4 sec
  ui[3]: "sw8" # active low + 8 sec
  ui[4]: "cont_sense" # active hi continuty sense
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "cont_enable" # act low cont measurement enable
  uo[1]: "speaker" # output to 4kz-6khz piezo
  uo[2]: "speaker_n" # output to 4kz-6khz piezo
  uo[3]: "deploy" # deploy fet gate driver
  uo[4]: "dump" # dump fet gate driver
  uo[5]: "charge" # 30V charge enable
  uo[6]: "status_led" # Active high status led
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "sda_accel" # I2C bus for MCX400 accellerometer
  uio[1]: "scl_accel"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6

# Tiny Tapeout project information

project:
  title: "DSP MAC Engine"
  author: "Maaz Ahmed Khan"
  discord: ""
  description: "8x8 signed multiply-accumulate engine with byte-serial I/O"
  language: "Verilog"
  clock_hz: 50000000
  tiles: "1x1"
  top_module: "tt_um_mac_engine"
  source_files:
    - "project.v"

pinout:
  ui[0]: "operand data bus bit 0"
  ui[1]: "operand data bus bit 1"
  ui[2]: "operand data bus bit 2"
  ui[3]: "operand data bus bit 3"
  ui[4]: "operand data bus bit 4"
  ui[5]: "operand data bus bit 5"
  ui[6]: "operand data bus bit 6"
  ui[7]: "operand data bus bit 7"

  uo[0]: "accumulator byte out 0"
  uo[1]: "accumulator byte out 1"
  uo[2]: "accumulator byte out 2"
  uo[3]: "accumulator byte out 3"
  uo[4]: "accumulator byte out 4"
  uo[5]: "accumulator byte out 5"
  uo[6]: "accumulator byte out 6"
  uo[7]: "accumulator byte out 7"

  uio[0]: "load_a (strobe)"
  uio[1]: "load_b (strobe)"
  uio[2]: "mac_en (strobe)"
  uio[3]: "clr_acc (strobe)"
  uio[4]: "rd_next (strobe)"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6

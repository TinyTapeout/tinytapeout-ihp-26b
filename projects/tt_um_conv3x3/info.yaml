# Tiny Tapeout project information
project:
  title:        "3x3 Clock Rate Streaming Input Convolution Engine"      # Project title
  author:       "Yahya Numan Incirkus"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "3x3 linear convolution through a singular MAC unit, 8-bit pixel input 6-bit weights"      # One line description of what your project does
  language:     "Verilog" #Written in VHDL turned into verilog through GHDL   # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     500000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_conv3x3"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0 (pixel / weight / config)"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs
  uo[0]: "RESULT0"
  uo[1]: "RESULT1"
  uo[2]: "RESULT2"
  uo[3]: "RESULT3"
  uo[4]: "RESULT4"
  uo[5]: "RESULT5"
  uo[6]: "RESULT6"
  uo[7]: "RESULT7"

  # Bidirectional pins
  uio[0]: "S_TVALID (in)"
  uio[1]: "S_TUSER window start (in)"
  uio[2]: "S_TLAST window end (in)"
  uio[3]: "WGHUPD weight load (in)"
  uio[4]: "RNDGSET config load (in)"
  uio[5]: "M_TREADY (in)"
  uio[6]: "M_TVALID (out)"
  uio[7]: "S_TREADY (out)"

# Do not change!
yaml_version: 6

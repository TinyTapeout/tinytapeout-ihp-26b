# Tiny Tapeout project information
project:
  title:        "Configurable Low-Latency Match-Action Packet Processor"      # Project title
  author:       "Giulio Girelli"      # Your name
  discord:      "biggigo14"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Configurable low-latency packet-processing ASIC with programmable match-action classification"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_GiulioGirelli_packet_processor"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "pp_collection.sv"
    - "pp_rules.sv"
    - "pp_stats.sv"
    - "pp_match.sv"
    - "pp_core.sv"
    - "pp_input.sv"
    - "pp_output.sv"
    - "pp_chip.sv"
    - "tt_um_GiulioGirelli_packet_processor.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "in[0]"
  ui[1]: "in[1]"
  ui[2]: "in[2]"
  ui[3]: "in[3]"
  ui[4]: "in[4]"
  ui[5]: "in[5]"
  ui[6]: "in[6]"
  ui[7]: "in[7]"

  # Outputs
  uo[0]: "out[0]"
  uo[1]: "out[1]"
  uo[2]: "out[2]"
  uo[3]: "out[3]"
  uo[4]: "out[4]"
  uo[5]: "out[5]"
  uo[6]: "out[6]"
  uo[7]: "out[7]"

  # Bidirectional pins
  uio[0]: "cfg_mode"
  uio[1]: "packet_status[0]"
  uio[2]: "packet_status[1]"
  uio[3]: "rst_type[0]"
  uio[4]: "rst_type[1]"
  uio[5]: "out_state[0]"
  uio[6]: "out_state[1]"
  uio[7]: "out_state[2]"

# Do not change!
yaml_version: 6

# Tiny Tapeout project information
project:
  title:        "Multi Segment Monitor"
  author:       "Matt Venn & Claude"
  discord:      "mattvenn"
  description:  "Simulates a 64x37 array of 7 segment displays on a VGA screen"
  language:     "Verilog"
  clock_hz:     40000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"

  top_module:  "tt_um_multi_seg_monitor"

  source_files:
    - tt_um_multi_seg_monitor.v
    - multi_seg_monitor.v
    - palette.v
    - palette_presets.v
    - config_port.v
    - VgaSyncGen.v
    - line_buffer.v
    - zoneplate.v
    - stream_in.v
    # IHP foundry SRAM behavioural model. Blackboxed for synthesis via the lib in
    # src/config.json; line_buffer.v only instantiates it when IHP_SRAM is defined,
    # which config.json does for the ASIC build. See SPEC.md section 8.2.
    - RM_IHPSG13_1P_1024x8_c2_bm_bist.v

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
#
# ui[3:0] are also a reset-time config strap: sampled every cycle rst_n is
# low and latched once it rises. ui[0] picks the Pmod (0=Digilent PmodVGA,
# 1=Tiny VGA); ui[3:1] pick one of 8 built-in colour palettes.
#
# After reset ui carries stream data while uio[7] is high. While it is low
# the internal generator draws the picture and ui[6:1] are read as live DIP
# switches instead (all off = the default attract mode), until the first
# valid config packet header hands the pins to the host for good. A packet
# strobed in while uio[7] is low can override the Pmod and the palette.
# See src/config_port.v.
pinout:
  # Inputs
  ui[0]: "stream data 0 / reset strap: 0=Digilent PmodVGA, 1=Tiny VGA Pmod"
  ui[1]: "stream data 1 / strap+switch: palette bit 0"
  ui[2]: "stream data 2 / strap+switch: palette bit 1"
  ui[3]: "stream data 3 / strap+switch: palette bit 2"
  ui[4]: "stream data 4 / switch: 1 = hold palette ui[3:1], 0 = change every 512 frames"
  ui[5]: "stream data 5 / switch: 1 = steady ring speed, 0 = let it wander"
  ui[6]: "stream data 6 / switch: 1 = steady source drift, 0 = let it wander"
  ui[7]: "stream data 7"

  # Outputs. Digilent PmodVGA (4 bits/channel, R/B nibbles) unless the reset
  # strap above selects Tiny VGA (2 bits/channel, all on uo_out -- see
  # src/tt_um_multi_seg_monitor.v for the exact bit order, reconstructed from
  # this project's original Tiny VGA prototype).
  uo[0]: "Digilent: R0 / Tiny VGA: R1"
  uo[1]: "Digilent: R1 / Tiny VGA: G1"
  uo[2]: "Digilent: R2 / Tiny VGA: B1"
  uo[3]: "Digilent: R3 / Tiny VGA: vsync"
  uo[4]: "Digilent: B0 / Tiny VGA: R0"
  uo[5]: "Digilent: B1 / Tiny VGA: G0"
  uo[6]: "Digilent: B2 / Tiny VGA: B0"
  uo[7]: "Digilent: B3 / Tiny VGA: hsync"

  # Bidirectional pins. Digilent PmodVGA only (G nibble + sync); Tiny VGA is a
  # uo_out-only Pmod and leaves uio[0:5] unused -- uio_oe goes all-input in
  # that mode. uio[6:7] (stream strobe/mode select) are the same pins in
  # both modes; PmodVGA's second connector leaves them not-connected either way.
  uio[0]: "Digilent: G0 (unused, Tiny VGA)"
  uio[1]: "Digilent: G1 (unused, Tiny VGA)"
  uio[2]: "Digilent: G2 (unused, Tiny VGA)"
  uio[3]: "Digilent: G3 (unused, Tiny VGA)"
  uio[4]: "Digilent: hsync (unused, Tiny VGA)"
  uio[5]: "Digilent: vsync (unused, Tiny VGA)"
  uio[6]: "stream strobe; config strobe while uio[7] is low (same pin in both Pmod modes)"
  uio[7]: "1 = stream data, 0 = internal generator + config packets (same pin in both Pmod modes)"

# Do not change!
yaml_version: 6

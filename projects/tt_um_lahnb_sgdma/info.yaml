# Tiny Tapeout project information
project:
  title:        "TinyDMA: A Descriptor-Based Dual-PSRAM Memory Mover"      # Project title
  author:       "bennett_lahn"      # Your name
  discord:      "bkblox"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "TinyDMA bulk-copies between dual QSPI PSRAM using in-memory descriptors"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     66000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_lahnb_sgdma"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  # top.v must be first: tt-gds-action --create-user-config uses yowasp Yosys on
  # sources[0] only to extract TT ports. That file cannot use SV packages.
  # Simulation Makefile still compiles types.svh first.
  source_files:
    - "top.v"
    - "types.svh"
    - "qspi_engine.sv"
    - "sys_controller.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "START"
  ui[1]: ""
  ui[2]: "BUS_REQ"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "DONE"
  uo[1]: "BUS_GNT"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "FLASH_CS"
  uio[1]: "SIO0"
  uio[2]: "SIO1"
  uio[3]: "SCK"
  uio[4]: "SIO2"
  uio[5]: "SIO3"
  uio[6]: "RAM_A_CS"
  uio[7]: "RAM_B_CS"

# Do not change!
yaml_version: 6

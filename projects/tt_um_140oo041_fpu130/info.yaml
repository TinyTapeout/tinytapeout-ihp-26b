# Tiny Tapeout project information
project:
  title:        "FPU-130"      # Project title
  author:       "Aarush & Yogith"      # Your name
  discord:      "140oo041 & theskyispurple"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "a FPU for the 16bfloat format that takes commands over SPI"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_140oo041_fpu130"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "SPI.v"
    - "fsm.v"
    - "misc.v"
    - "FPU_Unit/fpu_system.v"
    - "FPU_Unit/fpu_core.v"
    - "FPU_Unit/sign_gen.v"
    - "Formatting/alignment_shifter.v"
    - "Formatting/normalizer.v"
    - "Formatting/rounder.v"
    - "Divider/dividerLUT.v"
    - "Multiplier/dadda_multiplier.v"
    - "Adders/fullAdder.v"
    - "Adders/halfAdder.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "CS SPI"
  uio[1]: "MOSI SPI"
  uio[2]: "MISO SPI"
  uio[3]: "SCK SPI"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""


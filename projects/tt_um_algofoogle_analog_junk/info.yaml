# Tiny Tapeout project information
project:
  title:        "Simple comparator + 2 DACs analog layout in a 1x1 tile"
  author:       "algofoogle (Anton Maurovic)"
  discord:      "algofoogle"
  description:  "IHP sg13g2 custom layout analog experiments in a regular TT 1x1 digital tile"
  language:     "Analog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 200x150 uM.
  tiles: "1x1"          # Valid values for analog projects: 1x2, 2x2

  # Commented out, as this is not a true TT "analog slot":
  # # How many analog pins does your project use?
  # analog_pins: 0        # Valid values: 0 to 6

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_algofoogle_analog_junk"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "pdac[0]"
  ui[1]: "pdac[1]"
  ui[2]: "pdac[2]"
  ui[3]: "pdac[3]"
  ui[4]: "pdac[4]"
  ui[5]: "pdac[5]"
  ui[6]: "pdac[6]"
  ui[7]: "pdac[7]"

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: "comparator_out"

  # Bidirectional pins
  uio[0]: "ndac[0]"
  uio[1]: "ndac[1]"
  uio[2]: "ndac[2]"
  uio[3]: "ndac[3]"
  uio[4]: "ndac[4]"
  uio[5]: "ndac[5]"
  uio[6]: "ndac[6]"
  uio[7]: "ndac[7]"

  # Commented out, as this is not a true TT "analog slot":
  # # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  # ua[0]: ""
  # ua[1]: ""
  # ua[2]: ""
  # ua[3]: ""
  # ua[4]: ""
  # ua[5]: ""

# Do not change!
yaml_version: 6

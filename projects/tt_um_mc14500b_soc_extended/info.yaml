# Tiny Tapeout project information
project:
  title:        "MC14500B Extended 1-bit Microcontroller SoC"
  author:       "Alexander Co Abad"
  discord:      ""
  description:  "An advanced 1-bit MCU SoC containing an MC14500B Core, 256-word ROM, 16-bit RAM, and dual IO expansion ports"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mc14500b_soc_extended"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "ext_in[0]"
  ui[1]: "ext_in[1]"
  ui[2]: "ext_in[2]"
  ui[3]: "ext_in[3]"
  ui[4]: "ext_in[4]"
  ui[5]: "ext_in[5]"
  ui[6]: "ext_in[6]"
  ui[7]: "ext_in[7]"

  # Outputs
  uo[0]: "ext_out[0]"
  uo[1]: "ext_out[1]"
  uo[2]: "ext_out[2]"
  uo[3]: "ext_out[3]"
  uo[4]: "ext_out[4]"
  uo[5]: "ext_out[5]"
  uo[6]: "ext_out[6]"
  uo[7]: "ext_out[7]"

  # Bidirectional pins
  uio[0]: "pc_out[0]"
  uio[1]: "pc_out[1]"
  uio[2]: "pc_out[2]"
  uio[3]: "pc_out[3]"
  uio[4]: "pc_out[4]"
  uio[5]: "pc_out[5]"
  uio[6]: "rr_out"
  uio[7]: "write_pulse"

# Do not change!
yaml_version: 6

# Tiny Tapeout project information
project:
  title:        "4-Tap Signed MAC Unit"
  author:       "Mohammed Abdul Mujeeb"
  discord:      ""
  description:  "Four-tap signed multiply-accumulate unit for DSP and dot-product operations."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies?
  tiles: "1x1"

  # Tiny Tapeout top module
  top_module:  "tt_um_4tap_mac"

  # List of project source files
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "TAP_SEL[0]"
  ui[1]: "TAP_SEL[1]"
  ui[2]: "LOAD_WEIGHT"
  ui[3]: "LOAD_SAMPLE"
  ui[4]: "START_MAC"
  ui[5]: "ACCUMULATE"
  ui[6]: "CLEAR_ACC"
  ui[7]: "UNUSED"

  # Outputs
  uo[0]: "MAC_RESULT[0]"
  uo[1]: "MAC_RESULT[1]"
  uo[2]: "MAC_RESULT[2]"
  uo[3]: "MAC_RESULT[3]"
  uo[4]: "MAC_RESULT[4]"
  uo[5]: "MAC_RESULT[5]"
  uo[6]: "MAC_RESULT[6]"
  uo[7]: "MAC_RESULT[7]"

  # Bidirectional pins
  uio[0]: "DATA_IN[0]"
  uio[1]: "DATA_IN[1]"
  uio[2]: "DATA_IN[2]"
  uio[3]: "DATA_IN[3]"
  uio[4]: "UNUSED"
  uio[5]: "UNUSED"
  uio[6]: "UNUSED"
  uio[7]: "UNUSED"

# Do not change!
yaml_version: 6

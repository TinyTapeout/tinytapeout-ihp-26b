# Tiny Tapeout project information
project:
  title:        "Sine Wave Synthesizer"      # Project title
  author:       "Alberto Beccari"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "This tile synthesizes sine waves in the audio frequency range by means of a CORDIC engine and pulse-density modulation."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     12288000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_abeccari_swsynth"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "noise.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs -- musical note selector: {octave[7:4], semitone[3:0]}
  ui[0]: "NOTE0 (semitone LSB)"
  ui[1]: "NOTE1"
  ui[2]: "NOTE2"
  ui[3]: "NOTE3 (semitone MSB; 0=A..11=G#)"
  ui[4]: "OCT0 (octave LSB)"
  ui[5]: "OCT1"
  ui[6]: "OCT2"
  ui[7]: "OCT3 (octave MSB; above A0=27.5Hz)"

  # Outputs -- 7-bit parallel sine (offset-binary) + 1-bit sigma-delta
  uo[0]: "SINE0 (sine LSB, offset-binary)"
  uo[1]: "SINE1"
  uo[2]: "SINE2"
  uo[3]: "SINE3"
  uo[4]: "SINE4"
  uo[5]: "SINE5"
  uo[6]: "SINE6 (sine MSB)"
  uo[7]: "PDM_I (1-bit sigma-delta audio out)"

  # Bidirectional pins -- used as debug outputs: sample strobe + cosine
  uio[0]: "SAMPLE_EN (48 kHz sample strobe)"
  uio[1]: "unused"
  uio[2]: "unused"
  uio[3]: "unused"
  uio[4]: "NOISE (1-bit white noise, maximal-length LFSR PRBS)"
  uio[5]: "SAW (1-bit sigma-delta sawtooth at the tone frequency)"
  uio[6]: "SQR (1-bit square wave at the tone frequency)"
  uio[7]: "PDM_Q (1-bit sigma-delta audio out - 90 degrees out of phase from PDM_I)"

# Do not change!
yaml_version: 6

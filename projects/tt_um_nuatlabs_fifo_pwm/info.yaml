# Tiny Tapeout project information
project:
  title:        "Async FIFO with CDC + PWM Peripheral"
  author:       "NUAT Labs"
  discord:      ""      # fill in your discord username if you have one
  description:  "8-deep async FIFO with Gray-code CDC and live 7-seg occupancy display, plus a small reusable PWM peripheral"
  language:     "Verilog"
  clock_hz:     0        # design tolerates a wide clock range; no strict target frequency

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nuatlabs_fifo_pwm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "async_fifo_cdc.v"
    - "seg7_decoder.v"
    - "pwm_gen.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "fifo_wr_en"
  ui[1]: "fifo_rd_en"
  ui[2]: "pwm_duty_load"
  ui[3]: "pwm_enable"
  ui[4]: "fifo_rd_clk_sel (1=use main clk, 0=use ui_in[7])"
  ui[5]: ""
  ui[6]: ""
  ui[7]: "ext_rd_clk (optional 2nd clock for true CDC demo)"

  # Outputs
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "pwm_out"

  # Bidirectional pins
  uio[0]: "fifo_wr_data[0] / pwm_duty_in[0]"
  uio[1]: "fifo_wr_data[1] / pwm_duty_in[1]"
  uio[2]: "fifo_wr_data[2] / pwm_duty_in[2]"
  uio[3]: "fifo_wr_data[3] / pwm_duty_in[3]"
  uio[4]: "fifo_rd_data[0] (output)"
  uio[5]: "fifo_rd_data[1] (output)"
  uio[6]: "fifo_rd_data[2] (output)"
  uio[7]: "fifo_rd_data[3] (output)"

# Do not change!
yaml_version: 6

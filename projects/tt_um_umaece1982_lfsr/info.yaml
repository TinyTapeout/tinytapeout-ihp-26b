# Tiny Tapeout project information
project:
  title: "Low-Power LFSR-Based Test Pattern Generator"
  author: "Umamaheswari Ramalingam"
  discord: ""
  description: "An 8-bit LFSR-based pseudo-random test pattern generator for VLSI testing."
  language: "Verilog"
  clock_hz: 10000000
  tiles: "1x1"
  top_module: "tt_um_umaece1982_lfsr"
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website.
pinout:
  # Inputs
  ui[0]: "Seed[0]"
  ui[1]: "Seed[1]"
  ui[2]: "Seed[2]"
  ui[3]: "Seed[3]"
  ui[4]: "Seed[4]"
  ui[5]: "Seed[5]"
  ui[6]: "Seed[6]"
  ui[7]: "Seed[7]"

  # Outputs
  uo[0]: "LFSR[0]"
  uo[1]: "LFSR[1]"
  uo[2]: "LFSR[2]"
  uo[3]: "LFSR[3]"
  uo[4]: "LFSR[4]"
  uo[5]: "LFSR[5]"
  uo[6]: "LFSR[6]"
  uo[7]: "LFSR[7]"

  # Bidirectional pins
  uio[0]: "LOAD_SEED"
  uio[1]: "ENABLE"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6

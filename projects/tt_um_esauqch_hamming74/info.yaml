# Tiny Tapeout project information
project:
  title:        "Hamming(7,4) encoder/decoder (IEEE)"      # Project title
  author:       "Esaú Quispe Checca"      # Your name
  discord:      "esauqch_62547"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Encodes a 4-bit word into a 7-bit Hamming(7,4) codeword, injects a single-bit error, then detects and corrects it — Equipo Triada CEG"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     100000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_esauqch_hamming74"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "err_pos[0]"
  ui[5]: "err_pos[1]"
  ui[6]: "err_pos[2]"
  ui[7]: ""

  # Outputs
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "error_flag"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "codeword[1] (p1)"
  uio[1]: "codeword[2] (p2)"
  uio[2]: "codeword[3] (d1)"
  uio[3]: "codeword[4] (p3)"
  uio[4]: "codeword[5] (d2)"
  uio[5]: "codeword[6] (d3)"
  uio[6]: "codeword[7] (d4)"
  uio[7]: ""

# Do not change!
yaml_version: 6

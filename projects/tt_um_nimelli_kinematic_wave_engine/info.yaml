# Tiny Tapeout project information
project:
  title:        "Kinematic Wave Engine"      # Project title
  author:       "Jeremie Willemin"      # Your name
  discord:      "nimelli"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-channel servo control for kinematic sculpture"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nimelli_kinematic_wave_engine"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "kwe_top.v"
    - "kwe_timebase.v"
    - "kwe_servo_pwm.v"
    - "kwe_sine_lut.v"
    - "kwe_sine.v"
    - "kwe_angle_map.v"
    - "kwe_amp_scale.v"
    - "kwe_speed_rom.v"
    - "kwe_phase_gen.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "rvd"
  ui[1]: "SPEED[0]"
  ui[2]: "SPEED[1]"
  ui[3]: "SPEED[2]"
  ui[4]: "SPEED[3]"
  ui[5]: "AMP[0]"
  ui[6]: "AMP[1]"
  ui[7]: "SPREAD"

  # Outputs
  uo[0]: "SERVO_PWM[0]"
  uo[1]: "SERVO_PWM[1]"
  uo[2]: "SERVO_PWM[2]"
  uo[3]: "SERVO_PWM[3]"
  uo[4]: "SERVO_PWM[4]"
  uo[5]: "SERVO_PWM[5]"
  uo[6]: "SERVO_PWM[6]"
  uo[7]: "SERVO_PWM[7]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: "MIRROR"
  uio[5]: "REVERSE[0]"
  uio[6]: "REVERSE[1]"
  uio[7]: ""

# Do not change!
yaml_version: 6

# Tiny Tapeout project information
project:
  title:        "VGA Flower"
  author:       "Laura, Matt & Claude"
  discord:      "mattvenn"
  description:  "Races the beam to draw a flower on a VGA display, no frame buffer"
  language:     "Verilog"
  clock_hz:     25200000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  top_module:  "tt_um_flower"

  source_files:
    - tt_um_flower.v
    - hvsync_generator.v

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (Tiny VGA Pmod, RGB222)
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "vsync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "hsync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6

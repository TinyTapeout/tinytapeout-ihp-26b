# Tiny Tapeout project information
project:
  title:        "Laser Gyro Lock-in Readout Core"
  author:       "Marco Flückiger"
  discord:      ""
  description:  "Open-loop lock-in demodulator for the digital readout electronics of a single-axis laser gyroscope (fiber-optic interferometer)"
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_gyro_lockin"

  source_files:
    - "tt_um_gyro_lockin.v"
    - "mod_ref_gen.v"
    - "lockin_demod.v"
    - "spi_slave.v"

pinout:
  ui[0]: "Delta-Sigma bitstream from photodiode ADC"
  ui[1]: "Enable (high = active)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "Modulation reference (square wave)"
  uo[1]: "Window done pulse (1x per modulation cycle)"
  uo[2]: "Heartbeat LED (~1 Hz)"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: "SPI SCK"
  uio[1]: "SPI MOSI"
  uio[2]: "SPI MISO"
  uio[3]: "SPI CS_N (active low)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6

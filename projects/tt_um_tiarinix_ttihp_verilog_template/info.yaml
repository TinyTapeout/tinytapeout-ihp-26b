# Tiny Tapeout project information
project:
  title:        "8-bit educational SAP-style CPU"      # Project title
  author:       "University of La Frontera"      # Your name
  description:  "A small 8-bit CPU (5 general-purpose registers, ALU, conditional jumps) with a shared bus and byte-programmable memory"
  language:     "SystemVerilog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0       # not yet characterized/timing-closed against a target frequency

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tiarinix_ttihp_verilog_template"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tiarinix_ttihp_verilog_template.sv"
    - "CPU.sv"
    - "modules/alu.sv"
    - "modules/control.sv"
    - "modules/memory.sv"
    - "modules/mux.sv"
    - "modules/plus_one_adder.sv"
    - "modules/register.sv"
    - "modules/tristate_buffer.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "external_input[0]"
  ui[1]: "external_input[1]"
  ui[2]: "external_input[2]"
  ui[3]: "external_input[3]"
  ui[4]: "external_input[4]"
  ui[5]: "external_input[5]"
  ui[6]: "external_input[6]"
  ui[7]: "external_input[7]"

  # Outputs
  uo[0]: "external_output[0]"
  uo[1]: "external_output[1]"
  uo[2]: "external_output[2]"
  uo[3]: "external_output[3]"
  uo[4]: "external_output[4]"
  uo[5]: "external_output[5]"
  uo[6]: "external_output[6]"
  uo[7]: "external_output[7]"

  # Bidirectional pins
  uio[0]: "program_mode"
  uio[1]: "program_wr"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
